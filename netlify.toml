# Netlify configuration for this Vite + React site.
# Build settings mirror .github/workflows/deploy-pages.yml (Node 22, `npm run build`, output in `dist`).
#
# ⚠️ Les variables VITE_* sont figées dans le bundle AU MOMENT DU BUILD.
#    Les définir dans Netlify (Project configuration > Environment variables)
#    ne suffit pas : il faut ensuite relancer un déploiement
#    (Deploys > Trigger deploy > Clear cache and deploy site).
#    Voir DEPLOY-NETLIFY.md.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pins the Node.js major version so Netlify's image defaults can't change the build.
  NODE_VERSION = "22"
  # VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY / VITE_ADMIN_PATH / VITE_LEADS_ENDPOINT
  # se règlent dans l'interface Netlify, jamais dans ce fichier (il est public).

# Tout le site tient dans index.html (CSS et JS inlinés) : si ce fichier reste
# en cache, le visiteur voit l'ancienne version ENTIÈRE. On l'interdit.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers (mirrored in public/_headers for Cloudflare Pages).
# `unsafe-inline` for scripts/styles is required: the build inlines everything
# into a single HTML file. Tighten `connect-src` if you remove VITE_LEADS_ENDPOINT.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Repli d'application : toute URL inconnue renvoie la page unique.
# (Le site utilise `#/admin-…`, ce repli n'est donc pas indispensable au routage,
# mais il évite un 404 sec sur une adresse mal recopiée.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
